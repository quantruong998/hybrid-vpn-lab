config setup
    charondebug="ike 2, knl 2, cfg 2"
    uniqueids=yes

conn %default
    keyexchange=ikev2

    leftauth=pubkey
    rightauth=pubkey

    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!

    dpdaction=restart
    dpddelay=10s
    dpdtimeout=30s

    ikelifetime=1h
    lifetime=30m
    rekeyfuzz=10%

    auto=start

conn hq-to-branch
    left=172.16.0.10
    leftid=172.16.0.10
    leftcert=/etc/ipsec.d/certs/hq-cert.pem
    leftsubnet=192.168.10.0/24

    right=172.16.0.20
    rightid=172.16.0.20
    rightsubnet=192.168.20.0/24
