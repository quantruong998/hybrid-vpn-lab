flush ruleset

table inet filter {

    set app_net {
        type ipv4_addr
        flags interval
        elements = { 192.168.10.0/24 }
    }

    set mgmt_net {
        type ipv4_addr
        flags interval
        elements = { 192.168.40.0/24 }
    }

    set mon_net {
        type ipv4_addr
        flags interval
        elements = { 192.168.50.0/24 }
    }

    set branch_net {
        type ipv4_addr
        flags interval
        elements = { 192.168.20.0/24 }
    }

    set ra_net {
        type ipv4_addr
        flags interval
        elements = { 10.50.0.0/24 }
    }

    set block_counter {
        type ipv4_addr . ipv4_addr . inet_proto . inet_service
        counter
        flags dynamic
        timeout 7d
        size 65536
    }

    set rlimit_addr {
        type ipv4_addr . ipv4_addr
        flags dynamic
        size 65536
    }


    chain input {
        type filter hook input priority 0;
        policy drop;

        iifname "lo" accept

        ct state { established, related } accept

        # Allow ICMP to the firewall itself for diagnostics
        meta l4proto icmp accept

        counter log prefix "FIREWALL VIOLATION INPUT: " reject
    }


    chain forward {
        type filter hook forward priority 0;
        policy drop;

        update @rlimit_addr { ip saddr . ip daddr limit rate over 100 mbytes/second } drop

        ct state { established, related } accept

        # Application -> Branch via IPsec
        ip saddr @app_net ip daddr @branch_net counter accept

        # Branch -> Application
        ip saddr @branch_net ip daddr @app_net counter accept

        # WireGuard Remote Access -> Application
        ip saddr @ra_net ip daddr @app_net counter accept
        ip saddr @ra_net ip daddr @mgmt_net counter reject

        # APP -> Monitoring: syslog only
        ip saddr @app_net ip daddr @mon_net tcp dport 514 counter accept
        ip saddr @app_net ip daddr @mon_net udp dport 514 counter accept

        # Management -> Application
        ip saddr @mgmt_net ip daddr @app_net counter accept

        # Management -> Monitoring
        ip saddr @mgmt_net ip daddr @mon_net counter accept

        update @block_counter { ip saddr . ip daddr . meta l4proto . tcp dport }
        update @block_counter { ip saddr . ip daddr . meta l4proto . udp dport }
        meta l4proto != { tcp, udp } update @block_counter { ip saddr . ip daddr . meta l4proto . 0 }
        counter log prefix "FIREWALL VIOLATION FORWARD: " reject
    }
}
